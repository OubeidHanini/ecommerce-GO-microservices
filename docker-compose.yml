# Run scripts/init-secrets.sh once first: it generates .env, which is never committed.
#
# Passwords reach containers as Docker secrets (files under /run/secrets/), not as
# environment variables, so they don't appear in `docker inspect`.

# Go services share the root Dockerfile; only the SERVICE build arg changes.
x-go-service: &go-service
  restart: unless-stopped # a service that loses RabbitMQ exits on purpose and must come back

x-rabbitmq-client: &rabbitmq-client
  MQ_HOST: rabbitmq
  MQ_USER: ${RABBITMQ_USER:?run scripts/init-secrets.sh}
  MQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  user_service_db_password:
    environment: USER_SERVICE_DB_PASSWORD
  product_service_db_password:
    environment: PRODUCT_SERVICE_DB_PASSWORD
  order_service_db_password:
    environment: ORDER_SERVICE_DB_PASSWORD
  rabbitmq_password:
    environment: RABBITMQ_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      USER_SERVICE_DB_PASSWORD_FILE: /run/secrets/user_service_db_password
      PRODUCT_SERVICE_DB_PASSWORD_FILE: /run/secrets/product_service_db_password
      ORDER_SERVICE_DB_PASSWORD_FILE: /run/secrets/order_service_db_password
    secrets:
      - postgres_password
      - user_service_db_password
      - product_service_db_password
      - order_service_db_password
    volumes:
      - ./deploy/config/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # The RabbitMQ image has no *_FILE variant: the password stays an environment variable here.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?run scripts/init-secrets.sh}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init-secrets.sh}
    ports:
      - "15672:15672" # admin UI: http://localhost:15672 (credentials in .env)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/user-service:latest
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_NAME: users_db
      DB_USER: user_service
      DB_PASSWORD_FILE: /run/secrets/user_service_db_password
    secrets:
      - user_service_db_password
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/product-service:latest
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      <<: *rabbitmq-client
      PORT: "8082"
      DB_HOST: postgres
      DB_NAME: products_db
      DB_USER: product_service
      DB_PASSWORD_FILE: /run/secrets/product_service_db_password
    secrets:
      - product_service_db_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/order-service:latest
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      <<: *rabbitmq-client
      PORT: "8083"
      DB_HOST: postgres
      DB_NAME: orders_db
      DB_USER: order_service
      DB_PASSWORD_FILE: /run/secrets/order_service_db_password
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
    secrets:
      - order_service_db_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/gateway:latest
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080" # set GATEWAY_PORT in .env if 8080 is taken
    environment:
      PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - user-service
      - product-service
      - order-service

  prometheus:
    image: prom/prometheus:v3.7.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/config/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000" # http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD from .env)
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Not started by `docker compose up`: docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: [loadtest]
    command: ["run", "/scripts/load.js"]
    environment:
      GATEWAY_URL: http://gateway:8080 # inside the network: measures the stack, not Docker's port forwarding
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - gateway

volumes:
  pgdata:
