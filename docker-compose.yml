# Go services share the root Dockerfile; only the SERVICE build arg changes.
x-go-service: &go-service
  restart: unless-stopped # a service that loses RabbitMQ exits on purpose and must come back

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672" # admin UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/user-service:latest
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://app:app@postgres:5432/users_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/product-service:latest
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://app:app@postgres:5432/products_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/order-service:latest
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://app:app@postgres:5432/orders_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    <<: *go-service
    image: ghcr.io/oubeidhanini/ecommerce-go-microservices/gateway:latest
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080" # GATEWAY_PORT=8090 docker compose up -d if 8080 is taken
    environment:
      PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - user-service
      - product-service
      - order-service

  prometheus:
    image: prom/prometheus:v3.7.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000" # http://localhost:3000 (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
