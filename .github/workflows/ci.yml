name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/oubeidhanini/ecommerce-go-microservices # GHCR requires lowercase names

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [platform, user-service, product-service, order-service, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # Build each module on its own, like the Dockerfile does: the root go.work
      # would otherwise hide a missing go.sum entry or a stale replace directive.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway dev secrets
        run: scripts/init-secrets.sh
      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/overlays/dev > /dev/null
          kubectl kustomize deploy/overlays/production > /dev/null

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway secrets
        run: scripts/init-secrets.sh
      - name: Start the stack
        run: docker compose up -d --build gateway
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets-scan, test, manifests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [user-service, product-service, order-service, gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production # add the KUBECONFIG secret to this environment to enable deployment
    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when no cluster is configured
        id: cluster
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::notice::No KUBECONFIG secret: deployment skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: imranismail/setup-kustomize@v2
        if: steps.cluster.outputs.configured == 'true'
      - name: Deploy the images of this commit
        if: steps.cluster.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube && echo "$KUBECONFIG_DATA" > ~/.kube/config
          cd deploy/overlays/production
          # Pin every image to this commit: "latest" would make rollbacks impossible.
          for svc in user-service product-service order-service gateway; do
            kustomize edit set image "$REGISTRY/$svc=$REGISTRY/$svc:${{ github.sha }}"
          done
          kubectl apply -k .
          for svc in user-service product-service order-service gateway; do
            kubectl -n ecommerce rollout status "deployment/$svc" --timeout=180s
          done
