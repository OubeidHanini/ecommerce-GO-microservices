# Docker Compose: targets are fixed. The "service" label matches the one set on Kubernetes,
# so the same Grafana dashboard works in both environments.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }
      - targets: ["user-service:8081"]
        labels: { service: user-service }
      - targets: ["product-service:8082"]
        labels: { service: product-service }
      - targets: ["order-service:8083"]
        labels: { service: order-service }
