# Kubernetes: pods are discovered dynamically, so scaling a Deployment needs no config change.
# A pod is scraped when it carries the prometheus.io/scrape and prometheus.io/port annotations.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ecommerce]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
