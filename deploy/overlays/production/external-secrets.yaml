# Secrets are not stored here: the External Secrets Operator copies them from the
# secret manager behind the "production-secrets" ClusterSecretStore (AWS Secrets Manager,
# GCP Secret Manager, Vault...) into Kubernetes Secrets with the names and keys the pods expect.
# Rotating a password in the secret manager propagates within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: postgres-superuser
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ecommerce-go-microservices/postgres-superuser
        property: password
---
