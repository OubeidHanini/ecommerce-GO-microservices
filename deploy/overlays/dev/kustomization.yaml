# Local cluster (minikube, kind). The secret files are generated by scripts/init-secrets.sh
# and git-ignored: this overlay renders only on a machine that ran the script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce

resources:
  - ../../base

# One Secret per consumer: each pod only mounts the credentials it needs.
secretGenerator:
  - name: postgres-superuser
    envs: [secrets/postgres-superuser.env]
  - name: user-service-db
    envs: [secrets/user-service-db.env]
  - name: product-service-db
    envs: [secrets/product-service-db.env]
  - name: order-service-db
    envs: [secrets/order-service-db.env]
  - name: rabbitmq
    envs: [secrets/rabbitmq.env]
  - name: grafana-admin
    envs: [secrets/grafana-admin.env]
