apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: order-service
          image: ghcr.io/oubeidhanini/ecommerce-go-microservices/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://app:$(DB_PASSWORD)@postgres:5432/orders_db?sslmode=disable
            - name: MQ_USER
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_USER }
            - name: MQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_PASS }
            - name: RABBITMQ_URL
              value: amqp://$(MQ_USER):$(MQ_PASSWORD)@rabbitmq:5672/
            - name: USER_SERVICE_URL
              value: http://user-service:80
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:80
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
