apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: stable DNS name for the StatefulSet pod
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # the volume root holds lost+found, which initdb refuses
            # Passwords are read from mounted files, never passed as plain environment values.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/superuser
            - name: USER_SERVICE_DB_PASSWORD_FILE
              value: /run/secrets/postgres/user-service
            - name: PRODUCT_SERVICE_DB_PASSWORD_FILE
              value: /run/secrets/postgres/product-service
            - name: ORDER_SERVICE_DB_PASSWORD_FILE
              value: /run/secrets/postgres/order-service
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/postgres
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-superuser
                  items: [{ key: password, path: superuser }]
              - secret:
                  name: user-service-db
                  items: [{ key: password, path: user-service }]
              - secret:
                  name: product-service-db
                  items: [{ key: password, path: product-service }]
              - secret:
                  name: order-service-db
                  items: [{ key: password, path: order-service }]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
