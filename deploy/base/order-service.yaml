apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      automountServiceAccountToken: false # the service never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
      containers:
        - name: order-service
          image: ghcr.io/oubeidhanini/ecommerce-go-microservices/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "orders_db"
            - name: DB_USER
              value: "order_service"
            - name: DB_PASSWORD_FILE
              value: "/run/secrets/db/password"
            - name: MQ_HOST
              value: "rabbitmq"
            - name: MQ_USER
              valueFrom:
                secretKeyRef: { name: rabbitmq, key: username }
            - name: MQ_PASSWORD_FILE
              value: "/run/secrets/rabbitmq/password"
            - name: USER_SERVICE_URL
              value: "http://user-service"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service"
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-credentials
              mountPath: /run/secrets/db
              readOnly: true
            - name: rabbitmq-credentials
              mountPath: /run/secrets/rabbitmq
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: order-service-db
            items: [{ key: password, path: password }]
        - name: rabbitmq-credentials
          secret:
            secretName: rabbitmq
            items: [{ key: password, path: password }]
